# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）
# dsh-skins 的 patch 行只有 ui-skin-center，汇总后自然展开
patchFrom:
  - ../dsh-orchestrator
  - ../dsh-web-ui-compat
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-live-stats
  - ../dsh-ssh
  - ../dsh-web-ui-settings
  - ../dsh-skins
rows:
  # dsh-im-bundle deliberately has an empty patch: dependency auto-loading its
  # patch as well as this aggregate row would register the same plugin twice.
  - xmanrui-dsh-im=@xmanrui/dsh-im
deps:
  - ../dsh-orchestrator
  - ../dsh-web-ui-compat
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-im-bundle
  - ../dsh-live-stats
  - ../dsh-ssh
  - ../dsh-web-ui-settings
  - ../dsh-skins
