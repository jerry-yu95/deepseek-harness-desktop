# dsh-extension-center bundle patch: inserts the client-only plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:.../packages/dsh-extension-center`.
#
# The node half (exports ".") is a no-op host loader; the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI, where it mounts the
# sidebar entries and the extension-center panel.
- insert:
    - id: extension-center
      name: '@linxin666/dsh-client-ui-extension-center'
