appId: studio.harness.design.desktop
productName: JIWEI
copyright: Copyright (c) 2026 jerry-yu95 and contributors

asar: true
npmRebuild: false
asarUnpack:
  - node_modules/**
compression: normal
afterPack: scripts/after-pack.cjs

directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json
  - '!**/*.map'
  - '!**/test/**'

win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: JIWEI-${version}-${arch}.${ext}
  target:
    - dmg
    - zip

dmg:
  artifactName: JIWEI-${version}-${arch}.${ext}
  title: JIWEI ${version}

nsis:
  artifactName: JIWEI-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: JIWEI

publish:
  provider: github
  owner: jerry-yu95
  repo: deepseek-harness-desktop
